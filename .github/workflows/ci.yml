name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  client:
    name: Client unit tests and build
    # A pull request from a branch of this repository is already covered by its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  server:
    name: Server API tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The backup test runs pg_dump and pg_restore, which must match the database's major version.
      - name: Install PostgreSQL 16 client tools
        run: |
          pg_dump --version | grep -q ' 16\.' || { sudo apt-get update && sudo apt-get install -y postgresql-client-16; }
          pg_dump --version
      - run: npm install --no-audit --no-fund --omit=optional
        working-directory: server
      - run: npm test
        working-directory: server

  e2e:
    name: Browser end-to-end test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the client
        working-directory: client
        run: npm install --no-audit --no-fund && npm run build
      - name: Install the server
        working-directory: server
        run: npm install --no-audit --no-fund --omit=optional
      - name: Install the browser
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the browser test
        working-directory: e2e
        run: npm test
      - name: Keep screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: e2e/failure-*.png
          if-no-files-found: ignore
